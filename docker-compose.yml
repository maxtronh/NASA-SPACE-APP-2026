networks:
  flame_net:
    driver: bridge

volumes:
  pg_data:

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: flame_db
    restart: always
    environment:
      POSTGRES_USER: flame_user
      POSTGRES_PASSWORD: flame_secure_pass
      POSTGRES_DB: flame_freefall
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flame_user -d flame_freefall"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - flame_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flame_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://flame_user:flame_secure_pass@db:5432/flame_freefall
      CORS_ORIGINS: "http://localhost:3000"
      ENABLE_AUTO_SEED: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - flame_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flame_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - flame_net
