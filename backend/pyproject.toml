[project]
name = "flame-in-freefall-backend"
version = "1.0.0"
description = "Flame in Freefall - NASA Microgravity Combustion Scientific Intelligence Platform Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.25",
    "pgvector>=0.2.5",
    "psycopg[binary]>=3.1.18",
    "httpx>=0.27.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "numpy>=1.26.0",
    "fastembed>=0.4.0",
    "rank-bm25>=0.2.2",
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["app", "."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["B008"]

